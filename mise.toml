# Необязательная фиксация инструментов локальной разработки (DevOps, issue #9).
# Никого не заставляет ставить mise: `just bootstrap` просто подхватит версии,
# если mise уже есть, иначе напечатает инструкцию. CI использует свои pin-ы.
[tools]
node = "22.23.2"
python = "3.14.0"
pnpm = "12.23.0"
uv = "0.12.15"
just = "1.59.0"
go = "1.25"
