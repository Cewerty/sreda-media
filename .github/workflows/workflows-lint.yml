name: Workflows lint

# Переиспользуемый workflow: проверка actionlint + zizmor.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows-lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cache Go tools
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-tools-${{ hashFiles('.github/workflows/workflows_lint.sh') }}
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Setup just
        uses: ./.github/actions/setup-just # zizmor: ignore[self-repository]
      - name: Lint workflows
        run: just workflows-lint
        env:
          GH_TOKEN: ${{ github.token }}
