name: Secrets

# Переиспользуемый workflow: gitleaks по всей истории (issue #13, замечание 2).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: История коммитов
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache gitleaks
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/bin
          key: gitleaks-v8.30.1-${{ runner.os }}
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.25'
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan full history
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner'
