name: Docs (GitHub Pages)

# Публикация подготовлена, но НЕ включена: ждём решения по #35 и адрес сайта.
# Включить: задать repository variable ENABLE_DOCS_PAGES=true и запустить workflow вручную.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  docs-check:
    name: Репетиция MkDocs (без публикации)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build docs strictly
        run: uvx --from mkdocs-material==9.8.2 mkdocs build --strict --site-dir /tmp/sreda-mkdocs-check

  build:
    name: Сборка документации
    if: ${{ vars.ENABLE_DOCS_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Build MkDocs
        run: uvx --from mkdocs-material==9.8.2 mkdocs build --strict --site-dir site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Публикация
    if: ${{ vars.ENABLE_DOCS_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
