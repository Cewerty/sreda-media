name: Docs links

# Ежедневная проверка относительных ссылок в docs/, без публикации.
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Relative links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check links
        run: python3 scripts/check_links.py
