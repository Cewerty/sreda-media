name: Config lint

# Переиспользуемый workflow: валидация JSON/TOML и структуры workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  config-lint:
    name: Конфигурация
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup just
        uses: ./.github/actions/setup-just # zizmor: ignore[self-repository]
      - name: Validate configs
        run: just config-lint
