name: CMS API

on:
  pull_request:
    paths:
      - 'apps/cms-api/**'
      - '.github/workflows/cms-api.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main]
    paths:
      - 'apps/cms-api/**'
      - '.github/workflows/cms-api.yml'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_call:

permissions:
  contents: read

jobs:
  cms-api:
    name: CMS API quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sreda
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: sreda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/cms-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: v1.59.0
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Configure test environment
        run: cp .env.example .env
      - name: Run CMS API quality gate
        env:
          UV_NO_SYNC: '1'
        run: just ci
