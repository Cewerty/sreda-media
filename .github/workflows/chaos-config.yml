name: Chaos compose config

# Учебный Compose-стек: проверяем валидность на чистом runner без запуска сервисов.
on:
  pull_request:
    paths:
      - 'deploy/chaos/**'
      - '.github/workflows/chaos-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate chaos compose
        run: docker compose -f deploy/chaos/docker-compose.yml -p sreda-chaos config --quiet
