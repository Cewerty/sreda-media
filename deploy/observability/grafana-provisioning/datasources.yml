apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false

  - name: ObservabilitySQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana
    database: observability
    sslmode: disable
    jsonData:
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_GRAFANA_PASSWORD}
    editable: false
